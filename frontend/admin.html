<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin — Guest Conversations</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --border: #2a2f3a;
    --text: #e8e9ed; --text-dim: #8b8f9c; --accent: #6366f1; --accent-soft: #6366f122;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  .list-col { border-right: 1px solid var(--border); overflow-y: auto; }
  .header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .header .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .header a { color: var(--accent); font-size: 12px; text-decoration: none; }
  .session-item { padding: 12px 20px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .session-item:hover { background: var(--panel-2); }
  .session-item.active { background: var(--accent-soft); border-left: 3px solid var(--accent); }
  .session-item .dest { font-weight: 600; font-size: 13px; }
  .session-item .preview { font-size: 12px; color: var(--text-dim); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; background: var(--accent-soft); color: var(--accent); }
  .detail-col { padding: 24px; overflow-y: auto; }
  .empty { color: var(--text-dim); padding: 40px; text-align: center; }
  .transcript { display: flex; flex-direction: column; gap: 10px; max-width: 700px; margin-bottom: 30px; }
  .msg { padding: 10px 14px; border-radius: 10px; font-size: 14px; white-space: pre-wrap; max-width: 80%; }
  .msg.user { align-self: flex-end; background: var(--accent); color: white; }
  .msg.assistant { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); }
  .state-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; max-width: 700px; }
  .state-box h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; color: var(--text-dim); }
  .state-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; font-family: monospace; }
</style>
</head>
<body>
<div class="app">
  <div class="list-col">
    <div class="header">
      <h1>Guest Conversations</h1>
      <div class="sub">Staff/admin view</div>
      <a href="/">&larr; Back to guest chat</a>
    </div>
    <div id="sessionList"></div>
  </div>
  <div class="detail-col" id="detail">
    <div class="empty">Select a conversation from the left to view the full transcript and guest state.</div>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
let activeSessionId = null;

async function loadSessions() {
  const resp = await fetch(`${API_BASE}/admin/sessions`);
  const sessions = await resp.json();
  const listEl = document.getElementById('sessionList');
  listEl.innerHTML = '';
  if (sessions.length === 0) {
    listEl.innerHTML = '<div class="empty">No conversations yet.</div>';
    return;
  }
  sessions.forEach(s => {
    const div = document.createElement('div');
    div.className = 'session-item' + (s.session_id === activeSessionId ? ' active' : '');
    div.onclick = () => loadDetail(s.session_id);
    div.innerHTML = `
      <div class="dest">${s.destination || 'Destination unknown'} <span class="badge">${s.stage}</span></div>
      <div class="preview">${s.last_message || '(no messages)'}</div>
      <div class="meta">${s.session_id} · ${s.message_count} messages</div>
    `;
    listEl.appendChild(div);
  });
}

async function loadDetail(sessionId) {
  activeSessionId = sessionId;
  loadSessions(); // re-render to highlight active
  const resp = await fetch(`${API_BASE}/admin/sessions/${sessionId}`);
  const data = await resp.json();
  const detailEl = document.getElementById('detail');

  let transcriptHtml = '<div class="transcript">';
  data.history.forEach(msg => {
    if (typeof msg.content === 'string') {
      transcriptHtml += `<div class="msg ${msg.role}">${msg.content}</div>`;
    }
  });
  transcriptHtml += '</div>';

  const stateFields = Object.entries(data.state).map(([k, v]) => {
    const val = Array.isArray(v) ? v.join(', ') : (v ?? '—');
    return `<div>${k}</div><div>${val}</div>`;
  }).join('');

  detailEl.innerHTML = `
    <h2 style="font-size:16px;margin-top:0;">${sessionId}</h2>
    ${transcriptHtml}
    <div class="state-box">
      <h3>Current State</h3>
      <div class="state-grid">${stateFields}</div>
    </div>
  `;
}

loadSessions();
setInterval(loadSessions, 5000); // auto-refresh list every 5s for near-live monitoring
</script>
</body>
</html>
